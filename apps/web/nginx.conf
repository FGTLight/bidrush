# Serves the SPA and reverse-proxies the API on the same origin, so the
# session cookie is first-party. Requests are spread over both API
# instances; no sticky sessions are needed (state lives in Postgres/Redis).

upstream api {
    # Re-resolve the containers' names (Docker's DNS) so recreating an API
    # container doesn't leave nginx pointing at its old IP (502s).
    zone api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api-1:3000 resolve;
    server api-2:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location /ws {
        proxy_pass http://api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # Hashed assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes.
    location / {
        try_files $uri /index.html;
    }
}
